name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install ffmpeg (runtime dep; e2e test exercises the real binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import smoke
        run: |
          python -c "from open_video.core.backend import ModelBackend, ShotRequest, Capabilities; print('core OK')"
          python -c "from open_video.core.pipeline import LongFilmPipeline, Shot; print('pipeline OK')"
          python -c "from open_video.core.judge import QualityJudge, Verdict; print('judge OK')"
          python -c "from open_video.core.h3_weights import inventory_h3_int8, known_models; assert 'h3' in known_models(); print('h3_weights OK')"
          python -c "from open_video.core.resources import recommend_quant; print(recommend_quant(32768, has_nvidia=True).quant)"

      - name: CLI smoke (no GPU)
        run: |
          python cli/open_video.py list-models
          python cli/open_video.py recommend-quant --vram 8192 --json
          python cli/open_video.py pull h3 --check-only || true
          python cli/open_video.py "sunset waves" --dry-run

  wheel-smoke:
    name: wheel smoke (installed, non-editable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install in clean venv, smoke away from the source tree
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "
          import open_video, open_video.judges as j
          from open_video import H3Backend, ComfyUIAdapter
          assert 'site-packages' in open_video.__file__, open_video.__file__
          assert j.JUDGES, j.JUDGES
          print('wheel import OK:', sorted(j.JUDGES))
          "
          /tmp/wheel-venv/bin/open-video list-models
          /tmp/wheel-venv/bin/open-video list-presets
          /tmp/wheel-venv/bin/open-video "sunset waves" --dry-run
      - name: Only open_video may ship top-level
        run: |
          stray=$(ls /tmp/wheel-venv/lib/python*/site-packages | grep -vE '^(open_video|.*\.dist-info|pip|setuptools|wheel|pkg_resources|__pycache__)$' || true)
          if [ -n "$stray" ]; then echo "stray top-level packages: $stray"; exit 1; fi

      - name: Importing shipped modules must not write into site-packages
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import open_video.scripts.h3_agent, open_video.scripts.h3_generate_benchmark, open_video.judges"
          extra=$(find /tmp/wheel-venv/lib/python*/site-packages/open_video -type d \( -name output -o -name artifacts \) | head -1)
          if [ -n "$extra" ]; then echo "import created state dir in site-packages: $extra"; exit 1; fi

  lint-shell:
    name: install.sh policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer structure tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_install_sh_policy.py -q --tb=short
