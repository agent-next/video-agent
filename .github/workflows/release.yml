name: Release

# Create a GitHub Release when a version tag is pushed (e.g. v0.1.0).
# Does NOT publish the repo — visibility stays owner-controlled.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"

      - name: Install ffmpeg (runtime dep; e2e test exercises the real binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install + test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest tests/ -q --tb=short

      - name: Build sdist/wheel
        run: |
          pip install build
          python -m build

      - name: Install wheel smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "
          import open_video
          assert 'site-packages' in open_video.__file__, open_video.__file__
          "
          /tmp/wheel-venv/bin/python -m open_video --help
          /tmp/wheel-venv/bin/python -m open_video list-models
          /tmp/wheel-venv/bin/python -m open_video list-presets

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '/^## \[/ { on = index($0, h) == 1; next } on' CHANGELOG.md > release-body.md
          grep -q '[^[:space:]]' release-body.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release-body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
