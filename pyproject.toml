# open-video packaging. Modern PEP 621 metadata; setuptools build backend.
# After install: `open-video "prompt"` / `python -m open_video` / `import open_video`.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-video"
version = "0.1.0"
description = "v0.1.0: Ollama for MiniMax H3 + agent skill harness — any agent can generate high-quality local video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "OpenVideo Contributors" },
]
keywords = [
    "video-generation",
    "text-to-video",
    "comfyui",
    "minimax-h3",
    "agent",
    "open-source",
    "generative",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime Python deps: NONE. The core path (plan -> craft -> validate -> generate
# via engine -> judge -> stitch) imports only the Python standard library; it talks
# to ComfyUI over HTTP via urllib and to ffmpeg/ffprobe via subprocess. System deps
# (ffmpeg/ffprobe, a running ComfyUI) are documented, not pip-installed.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.scripts]
# Console entry point -> open_video/__main__.py:main -> cli/open_video.py:main
# (packaged as open_video.cli.open_video via [tool.setuptools.package-dir]).
open-video = "open_video.__main__:main"

[project.urls]
Homepage = "https://open-video.ai"
Repository = "https://github.com/agent-next/video-agent"
Documentation = "https://github.com/agent-next/video-agent/tree/master/docs"
Issues = "https://github.com/agent-next/video-agent/issues"
HuggingFace = "https://huggingface.co/open-video-ai/open-video"

# --- packaging layout --------------------------------------------------------
# Source tree keeps core/, backends/, engines/, judges/, cli/ as sibling dirs of
# open_video/ so documented repo paths (`python cli/open_video.py`,
# backends/h3/PROMPT_GRAMMAR.md, scripts/install.sh) stay true. The wheel,
# however, ships a SINGLE top-level package: package-dir maps each sibling dir
# to an open_video.* subpackage, so site-packages gains only `open_video/`
# (no generic `core`/`cli` top-level names). All imports use the canonical
# `open_video.*` form; open_video/__init__.py extends __path__ so those imports
# also resolve in a plain source checkout.
[tool.setuptools]
packages = [
    "open_video",
    "open_video.cli",
    "open_video.core",
    "open_video.backends",
    "open_video.backends.h3",
    "open_video.engines",
    "open_video.engines.comfyui",
    "open_video.judges",
    "open_video.library",
    "open_video.models",
    "open_video.scripts",
]

[tool.setuptools.package-dir]
"open_video.cli" = "cli"
"open_video.core" = "core"
"open_video.backends" = "backends"
"open_video.engines" = "engines"
"open_video.judges" = "judges"
"open_video.library" = "library"
"open_video.models" = "models"
"open_video.scripts" = "scripts"

# Ship the runtime data the CLI advertises: H3 workflow templates + the official
# prompt grammar (backend.prompt_guide), prompt presets (list-presets), and
# the pinned weight manifest used by pull. REPO_ROOT-relative lookups in the CLI
# resolve identically in a source checkout and inside the installed package.
[tool.setuptools.package-data]
"open_video.backends.h3" = ["workflows/*.json", "PROMPT_GRAMMAR.md"]
"open_video.library" = ["prompts/*.txt", "prompts/*.md"]
"open_video.scripts" = ["install.sh", "h3_download.sh", "h3_aria2_list.txt", "comfyui.pin"]
"open_video.models" = ["h3_manifest.json"]
